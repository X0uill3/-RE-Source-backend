name: 02-5 - Staging - ZAP Scan

on:
  workflow_call

jobs:
  Back_Zap_Scan:
    runs-on: ubuntu-latest

    steps:
      - name: Run ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          format: openapi
          target: 'http://staging.ressources-relationnelles.com:5000/api-docs'
          fail_action: true
          artifact_name: 'back_zap_scan'
          issue_title: 'ZAP Back Scan Report'

  Front_Zap_Scan:
    runs-on: ubuntu-latest

    steps:
      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://staging.ressources-relationnelles.com'
          fail_action: true
          artifact_name: 'front_zap_scan'
          issue_title: 'ZAP Front Scan Report'
