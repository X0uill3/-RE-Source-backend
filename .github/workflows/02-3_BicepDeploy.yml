name: 02-3 - Staging - Bicep Deploy

on:
  workflow_call

jobs:
  AzureServer:
    runs-on: ubuntu-22.04

    env:
      ResourceGroupName: "RessourcesRelationnelles-Staging"
      ResourceGroupLocation: "francecentral"

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Azure CLI Resource Group
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az group create --name ${{ env.ResourceGroupName }} --location ${{ env.ResourceGroupLocation }}

      - name: Checkout Bicep
        uses: actions/checkout@v4

      - name: Azure Bicep Deploy
        uses: azure/arm-deploy@v2
        with:
          resourceGroupName: ${{ env.ResourceGroupName }}
          scope: resourcegroup
          template: ./main.bicep
          parameters: >
            adminUsername=${{secrets.AZURE_VM_LOGIN}}
            adminPasswordOrKey=${{secrets.AZURE_VM_PASSWORD}}
            vmName=vm-staging
            vmSize=Standard_B2s

      - name: Open Ports on Security Group
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az network nsg rule create --resource-group ${{env.ResourceGroupName}} --nsg-name SecGroupNet --name PortBack-5000 --priority 100 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes "*" --source-port-ranges "*" --destination-address-prefixes "*" --destination-port-ranges 5000
            az network nsg rule create --resource-group ${{env.ResourceGroupName}} --nsg-name SecGroupNet --name PortFront-80 --priority 101 --direction Inbound --access Allow --protocol Tcp --source-address-prefixes "*" --source-port-ranges "*" --destination-address-prefixes "*" --destination-port-ranges 80

      - name: Get Public IP
        if: success()
        uses: azure/CLI@v2
        with:
          inlineScript: |
            echo "AZURE_VM_IP=$(az vm show -d -g ${{env.ResourceGroupName}} -n vm-staging --query publicIps -o tsv)" >> $GITHUB_ENV

      - name: Install Docker on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{env.AZURE_VM_IP}}
          port: ${{secrets.PORT}}
          username: ${{secrets.AZURE_VM_LOGIN}}
          password: ${{secrets.AZURE_VM_PASSWORD}}
          script: |
            curl -o install_docker.sh https://raw.githubusercontent.com/Base-Auto/scripts/refs/heads/main/install_docker_quick.sh
            sudo bash ./install_docker.sh
