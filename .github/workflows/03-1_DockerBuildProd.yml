name: 03-1 - Production - Docker Build

on:
  workflow_call

env:
  REGISTRY: ghcr.io
  USERNAME: ${{github.actor}}

jobs:
  Build-Push-Docker-Prod:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Registry login
        uses: docker/login-action@v3
        with:
          registry: ${{env.REGISTRY}}
          username: ${{env.USERNAME}}
          password: ${{secrets.PAT_TOKEN}}

      - name: Downcase Image Name
        run: echo "IMAGE_NAME_LOWER=$(echo ${GITHUB_REPOSITORY,,} | sed 's|/-|/|g')" >> $GITHUB_ENV

      - name: Build and Push Production Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{env.REGISTRY}}/${{env.IMAGE_NAME_LOWER}}:prod
